<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="extension-container">
    <div class="header" style="position: relative;">
      <h2 class="title">Synapse</h2>
      <p class="subtitle">Quick Save</p>
      
      <!-- Profile Icon -->
      <div id="profile-icon" class="profile-icon">
        <!-- Logged Out SVG (Outline) -->
        <svg id="logged-out-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #a1a1aa;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>

        <!-- Logged In Initials -->
        <div id="logged-in-text" class="hidden" style="color: #fff; font-weight: 700; font-size: 0.85rem;"></div>
      </div>
    </div>

    <!-- NOT LOGGED IN STATE -->
    <div id="logged-out-view" class="hidden" style="text-align: center; margin-top: 1rem;">
      <p style="font-size: 0.9rem; margin-bottom: 1.2rem; color: #a1a1aa;">
        Please login to have a better experience!
      </p>
      <button class="btn btn-primary" id="open-login-btn" style="width: 100%; justify-content: center;">
        Log In to Synapse
      </button>
    </div>

    <!-- LOGGED IN STATE -->
    <div id="logged-in-view" class="actions hidden">
      <!-- Option 1: Save Website -->
      <button class="btn btn-primary" id="save-website-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        Save Website
      </button>

      <!-- Option 2: Create & Save -->
      <div class="dropdown-wrapper">
        <button class="btn btn-outline" id="create-save-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Create & Save
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        
        <!-- Sub-options -->
        <div class="dropdown-menu" id="sub-options">
          <button class="btn btn-sub" id="create-image-btn">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
             Image
          </button>
          <button class="btn btn-sub" id="create-video-btn">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
             Video
          </button>
        </div>
      </div>
    </div>

    <!-- SAVE FORM VIEW -->
    <div id="save-form-view" class="hidden" style="display: flex; flex-direction: column; gap: 0.8rem;">
      <div class="form-group">
        <input type="text" id="save-category" class="form-control" placeholder="Category" list="category-options" required>
        <datalist id="category-options"></datalist>
      </div>
      <div class="form-group">
        <input type="text" id="save-subcategory" class="form-control" placeholder="Sub-Category (Optional)" list="subcategory-options">
        <datalist id="subcategory-options"></datalist>
      </div>
      <div class="form-group">
        <textarea id="save-content" class="form-control" placeholder="Content(optional)" rows="3" style="resize: none;"></textarea>
      </div>
      <div class="form-group">
        <input type="text" id="save-url" class="form-control" placeholder="URL">
      </div>
      <div class="form-actions" style="display: flex; gap: 0.5rem; margin-top: 0.2rem;">
        <button class="btn btn-outline" id="cancel-save-btn" style="flex: 1; padding: 0.6rem;">Cancel</button>
        <button class="btn btn-primary" id="submit-save-btn" style="flex: 1; padding: 0.6rem;">Save</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
